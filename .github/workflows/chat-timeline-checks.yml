name: Chat Timeline - focused checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  date-selection:
    if: ${{ github.event.repository.private == false }}
    runs-on: xcode-27
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            submodules/TelegramUI/Sources
            submodules/TelegramCore/Sources
            submodules/AuthorizationUI/Sources
            submodules/MtProtoKit/PublicHeaders
            Tests/ChatTimeline
            ci/chat-timeline
            build-system
          persist-credentials: false
          submodules: false

      - name: Require the pinned installed Xcode
        run: |
          if [ -d /Applications/Xcode_27.1.app/Contents/Developer ]; then
            sudo xcode-select --switch /Applications/Xcode_27.1.app/Contents/Developer
          fi
          xcodebuild -version > "$RUNNER_TEMP/chat-timeline-xcode-version.txt"
          cat "$RUNNER_TEMP/chat-timeline-xcode-version.txt"
          grep -Fxq 'Xcode 27.1' "$RUNNER_TEMP/chat-timeline-xcode-version.txt"
          xcrun swiftc --version
          printf 'Source revision: %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Compile the request header with native Objective-C nullability checks
        run: |
          ios_sdk_path="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -target arm64-apple-ios15.0 \
            -isysroot "$ios_sdk_path" \
            -fmodules -fmodules-cache-path="$RUNNER_TEMP/mtrequest-module-cache" \
            -fobjc-arc -fblocks -fsyntax-only -x objective-c \
            -Werror -Wnullability-completeness \
            submodules/MtProtoKit/PublicHeaders/MtProtoKit/MTRequest.h
          printf '%s\n' 'MTRequest.h compiled with iPhoneOS SDK and nullability warnings as errors. Full app compilation remains separate.' >> "$GITHUB_STEP_SUMMARY"

      - name: Check Swift syntax of the feature and changed integration files
        run: |
          test -f submodules/TelegramUI/Sources/ChatTimelineDateSelection.swift
          for file in submodules/TelegramUI/Sources/ChatTimeline*.swift \
            submodules/TelegramUI/Sources/ChatController.swift \
            submodules/TelegramUI/Sources/ChatHistoryListNode.swift \
            submodules/TelegramUI/Sources/Chat/ChatControllerNavigateToMessage.swift \
            submodules/TelegramCore/Sources/TelegramEngine/Messages/SearchMessages.swift \
            submodules/TelegramCore/Sources/TelegramEngine/Messages/TelegramEngineMessages.swift \
            submodules/TelegramCore/Sources/Authorization.swift \
            submodules/TelegramCore/Sources/AuthorizationDiagnostics.swift \
            submodules/TelegramCore/Sources/TelegramEngine/Auth/AuthTransfer.swift \
            submodules/TelegramCore/Sources/TelegramEngine/Auth/TelegramEngineAuth.swift \
            submodules/TelegramCore/Sources/Network/NetworkEngine.swift \
            submodules/TelegramCore/Sources/Network/MtProtoKitEngine.swift \
            submodules/TelegramCore/Sources/Network/Network.swift \
            submodules/AuthorizationUI/Sources/AuthorizationQRLogin*.swift \
            submodules/AuthorizationUI/Sources/AuthorizationSequencePhoneEntryController.swift \
            submodules/AuthorizationUI/Sources/AuthorizationSequencePhoneEntryControllerNode.swift \
            submodules/AuthorizationUI/Sources/AuthorizationSequenceController.swift; do
            xcrun swiftc -frontend -parse "$file"
          done

      - name: Compile and run pure Foundation date-selection regression checks
        run: |
          xcrun swiftc \
            submodules/TelegramUI/Sources/ChatTimelineDateSelection.swift \
            Tests/ChatTimeline/TimelineDateSelectionChecks.swift \
            -o "$RUNNER_TEMP/timeline-date-tests"
          "$RUNNER_TEMP/timeline-date-tests"
          printf '%s\n' 'Swift syntax and Foundation date-selection checks passed. Full app compilation, native UI behavior and iPhone tests remain separate.' >> "$GITHUB_STEP_SUMMARY"

      - name: Compile and run pure Foundation authorization-diagnostics checks
        run: |
          xcrun swiftc \
            submodules/TelegramCore/Sources/AuthorizationDiagnostics.swift \
            Tests/ChatTimeline/AuthorizationDiagnosticsChecks.swift \
            -o "$RUNNER_TEMP/authorization-diagnostics-tests"
          "$RUNNER_TEMP/authorization-diagnostics-tests"
          printf '%s\n' 'Foundation authorization-diagnostics checks passed. Network integration, full app compilation and authenticated iPhone behavior remain separate.' >> "$GITHUB_STEP_SUMMARY"

      - name: Compile and run pure Foundation QR-login lifecycle checks
        run: |
          xcrun swiftc \
            submodules/AuthorizationUI/Sources/AuthorizationQRLoginLifecycle.swift \
            Tests/ChatTimeline/AuthorizationQRLoginChecks.swift \
            -o "$RUNNER_TEMP/authorization-qr-login-tests"
          "$RUNNER_TEMP/authorization-qr-login-tests"
          printf '%s\n' 'Foundation QR-login lifecycle checks passed. UI types, full app compilation and owner-approved QR login remain separate.' >> "$GITHUB_STEP_SUMMARY"

      - name: Check deferred owner build boundaries without owner data
        run: |
          python3 -B ci/chat-timeline/test_bootstrap.py
          python3 -B ci/chat-timeline/test_deferred_build_configuration.py
          python3 -B ci/chat-timeline/test_owner_profile.py
          python3 -B ci/chat-timeline/test_private_cleanup.py
          python3 -B ci/chat-timeline/test_owner_ci.py
          python3 -B ci/chat-timeline/test_owner_signing_input.py
          printf '%s\n' 'Owner build tests use synthetic data. Native CMS rejection smoke checks SDK integration, not acceptance of an actual owner profile.' >> "$GITHUB_STEP_SUMMARY"
